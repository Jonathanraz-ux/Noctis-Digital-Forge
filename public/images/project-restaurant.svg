<svg viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#0a0a10"/>
  <defs>
    <linearGradient id="rg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a1a2e"/><stop offset="100%" stop-color="#0a0a10"/></linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#rg)"/>
  <!-- Interior wall -->
  <rect x="40" y="100" width="520" height="280" rx="8" fill="#0d0d14" stroke="rgba(0,255,153,0.04)" stroke-width="1"/>
